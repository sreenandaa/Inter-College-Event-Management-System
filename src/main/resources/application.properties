server.port=8080
spring.application.name=intercollege

# Data persistence directory (stored in /data folder relative to project root)
intercollege.data.dir=data

# Format dates as ISO-8601 strings rather than timestamps in JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Keep error responses clear and informative
server.error.include-message=always
server.error.include-binding-errors=always
